# Run every test suite on each push and pull request, on Linux, Windows and macOS.
#
# The `test` job runs scripts/test_all.py, the same command as on a developer's computer:
# Python, the viewer, Julia, the scripts and packaging, the web UI type check, the strict docs
# build, the documentation's code examples, the cross-language matrix and the viewer's tests in a
# real browser (Playwright's Chromium, on all three systems: a browser test that fails only on
# Windows or macOS shows up on a push, not first when releasing).
# MATLAB isn't on PATH there, so test_all reports its suites as skipped; the `matlab` job runs
# the MATLAB tests with MathWorks' actions instead (free for public repositories).
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:   # release.yml runs these same tests before building

permissions:
  contents: read

concurrency:   # a newer push to the same branch cancels the older run (a release run has its own group)
  group: tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: All suites (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]   # macOS includes Arial
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"   # test output contains θ, μ, …; Windows consoles default to another code page
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes no short tags like "v10", only exact versions; pinned by commit as its README does.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: viewer/web/package-lock.json

      - uses: julia-actions/setup-julia@v3
        with:
          version: "1"

      # The default style uses Arial. Windows has it; Ubuntu gets Microsoft's core fonts
      # (accepting their licence non-interactively), as packaging/linux/install.sh offers users.
      - name: Install Arial (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true" | sudo debconf-set-selections
          sudo apt-get update -q
          sudo apt-get install -y -q ttf-mscorefonts-installer
          fc-cache -f
          fc-list : family | grep -qix arial

      - name: Install Python packages
        run: uv sync --all-packages --group docs

      - name: Build the web UI
        working-directory: viewer/web
        run: |
          npm ci
          npm run build

      # Chromium for the viewer's end-to-end tests (viewer/tests/e2e); on Linux with the system
      # libraries it needs.
      - name: Install Chromium for the browser tests
        run: uv run playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium

      - name: Run all test suites
        run: uv run python scripts/test_all.py

  matlab:
    name: MATLAB tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: matlab-actions/setup-matlab@v3

      # The same check as [test].command in languages/matlab/language.toml.
      - uses: matlab-actions/run-command@v3
        with:
          command: cd languages/matlab; r = runtests('tests'); assert(~any([r.Failed]))
