# Run every test suite on each push and pull request, on Linux, Windows and macOS.
#
# The same scripts/test_all.py as on a developer's computer, split so that its parts run side by
# side on separate machines (free for a public repository), and the result comes in about the time
# of the slowest part:
#   - build-ui: builds the web UI once (and type-checks it); the other jobs download it;
#   - fast (per system): every suite but the browser tests and the cross-language matrix:
#     Python, the viewer, Julia, the scripts and packaging, the strict docs build, the
#     documentation's code examples;
#   - e2e (per system, in shards): the viewer's tests in a real browser (Playwright's Chromium),
#     split into parts of about equal time (viewer/tests/e2e/shards.py, durations.json), each part
#     itself in parallel (pytest-xdist);
#   - crosslang (per system): the cross-language round-trip matrix;
#   - matlab: the MATLAB tests with MathWorks' actions (free for public repositories). MATLAB
#     isn't on PATH in the other jobs, so test_all reports its suites as skipped there.
# Chromium and (on Linux) Arial are cached between runs.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:   # release.yml runs these same tests before building

permissions:
  contents: read

concurrency:   # a newer push to the same branch cancels the older run (a release run has its own group)
  group: tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"   # test output contains θ, μ, …; Windows consoles default to another code page

jobs:
  build-ui:
    name: Web UI (build, type check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: viewer/web/package-lock.json
      - name: Build the web UI (npm run build type-checks it first)
        working-directory: viewer/web
        run: |
          npm ci
          npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: web-ui
          path: viewer/src/lbd_viewer/static
          retention-days: 3

  fast:
    name: Suites (${{ matrix.os }})
    needs: build-ui
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]   # macOS includes Arial
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes no short tags like "v10", only exact versions; pinned by commit as its README does.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1"
      - uses: ./.github/actions/arial
        if: runner.os == 'Linux'
      - name: Install Python packages
        run: uv sync --all-packages --group docs
      # The Julia module's packages, installed and compiled before the suites run side by side (the
      # Julia examples in the tools tests and the docs need them while the Julia suite still runs).
      - name: Install the Julia module's packages
        working-directory: languages/julia
        run: julia --project=. --startup-file=no -e "using Pkg; Pkg.instantiate(); Pkg.precompile()"
      - uses: actions/download-artifact@v8
        with:
          name: web-ui
          path: viewer/src/lbd_viewer/static
      - name: Run the suites (all but the browser tests and the cross-language matrix)
        run: uv run python scripts/test_all.py --fast

  e2e:
    name: Browser tests (${{ matrix.os }}, ${{ matrix.shard }})
    needs: build-ui
    strategy:
      fail-fast: false
      matrix:
        include:   # shards: about equal parts (durations.json); macOS has fewer runners at a time
          - { os: ubuntu-latest, shard: 1/3 }
          - { os: ubuntu-latest, shard: 2/3 }
          - { os: ubuntu-latest, shard: 3/3 }
          - { os: windows-latest, shard: 1/3 }
          - { os: windows-latest, shard: 2/3 }
          - { os: windows-latest, shard: 3/3 }
          - { os: macos-latest, shard: 1/2 }
          - { os: macos-latest, shard: 2/2 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - uses: ./.github/actions/arial
        if: runner.os == 'Linux'
      - name: Install Python packages
        run: uv sync --all-packages
      - uses: actions/download-artifact@v8
        with:
          name: web-ui
          path: viewer/src/lbd_viewer/static
      # Chromium for Playwright, kept between runs (the key: the Playwright version in uv.lock).
      - uses: actions/cache@v4
        id: chromium
        with:
          path: |
            ~/.cache/ms-playwright
            ~/AppData/Local/ms-playwright
            ~/Library/Caches/ms-playwright
          key: chromium-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - name: Install Chromium for the browser tests
        if: steps.chromium.outputs.cache-hit != 'true'
        run: uv run playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium
      - name: Install Chromium's system libraries (Linux, Chromium from the cache)
        if: steps.chromium.outputs.cache-hit == 'true' && runner.os == 'Linux'
        run: uv run playwright install-deps chromium
      - name: Run the browser tests (shard ${{ matrix.shard }})
        run: uv run python scripts/test_all.py --only e2e --shard ${{ matrix.shard }}

  crosslang:
    name: Cross-language (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1"
      - name: Install Python packages
        run: uv sync --all-packages
      # The Julia module's packages (HDF5, JSON3 …); in the suites job its own tests install them.
      - name: Install the Julia module's packages
        working-directory: languages/julia
        run: julia --project=. --startup-file=no -e "using Pkg; Pkg.instantiate(); Pkg.precompile()"
      - name: Run the cross-language matrix
        run: uv run python scripts/test_all.py --only crosslang

  matlab:
    name: MATLAB tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: matlab-actions/setup-matlab@v3

      # The same check as [test].command in languages/matlab/language.toml.
      - uses: matlab-actions/run-command@v3
        with:
          command: cd languages/matlab; r = runtests('tests'); assert(~any([r.Failed]))
