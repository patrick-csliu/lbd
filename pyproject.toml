# uv workspace for development: one lock file, one virtual environment for all Python parts.
#   uv sync --all-packages        install the `lbd` language module, the viewer and dev tools
#   uv run pytest                 run the Python test suites
[tool.uv.workspace]
members = ["languages/python", "viewer"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",     # uv run pytest --cov=lbd --cov=lbd_viewer --cov-report=term-missing
    "httpx>=0.27",
    "pyinstaller>=6.10",
    "ipykernel>=6.29",     # run notebooks (e.g. playground/) with the dev environment
]

docs = [
    "mkdocs>=1.6,<2",            # MkDocs 2 drops the plugin system Material relies on
    "mkdocs-material>=9.5",
    "ruff>=0.6",                 # formats signatures in the generated API pages
    "mkdocstrings[python]>=0.26",
    "griffe-pydantic>=1.1",
]

[tool.pytest.ini_options]
testpaths = ["languages/python/tests", "viewer/tests", "tests/scripts", "tests/packaging"]
# An LBD warning nobody expects is a bug (something was ignored or changed): fail the test.
# Tests that expect one use pytest.warns(...).
filterwarnings = ["error::lbd.LBDWarning"]
