<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">LBD: data file + style = figure</title>
<desc id="d">A data file holds the measurement, a style holds how figures look; together they make the figure. The same style with any data file gives figures that match.</desc>
<rect width="960" height="330" rx="16" fill="#ffffff"/>
<rect x="24" y="24" width="270" height="236" rx="12" fill="#eef5fb" stroke="#0072b2" stroke-width="2"/>
<path d="M42 42 h18 l8 8 v26 h-26 z" fill="#ffffff" stroke="#0072b2" stroke-width="1.6"/><path d="M60 42 v8 h8" fill="none" stroke="#0072b2" stroke-width="1.6"/>
<text x="80" y="58" font-size="19" font-weight="700" fill="#1c2026" text-anchor="start" >Data file</text>
<text x="80" y="78" font-size="12.5" font-weight="normal" fill="#5d6673" text-anchor="start" >sweep.lbd · what you measured</text>
<text x="42" y="116" font-size="13.5" fill="#1c2026"><tspan font-weight="600">axes</tspan> <tspan fill="#5d6673">power (dBm), freq (Hz)</tspan></text>
<text x="42" y="137" font-size="13.5" fill="#1c2026"><tspan font-weight="600">values</tspan> <tspan fill="#5d6673">S21 (power × freq)</tspan></text>
<text x="42" y="158" font-size="13.5" fill="#1c2026"><tspan font-weight="600">units, labels</tspan> <tspan fill="#5d6673">Power, Frequency</tspan></text>
<text x="42" y="179" font-size="13.5" fill="#1c2026"><tspan font-weight="600">meta</tspan> <tspan fill="#5d6673">T = 12 mK, VNA settings</tspan></text>
<text x="42" y="200" font-size="13.5" fill="#1c2026"><tspan font-weight="600">view</tspan> <tspan fill="#5d6673">curves, in dB (optional)</tspan></text>
<text x="42" y="246" font-size="12" font-weight="normal" fill="#5d6673" text-anchor="start" font-style="italic">written by your own programs, in any language</text>
<text x="318" y="154.0" font-size="36" font-weight="700" fill="#5d6673" text-anchor="middle" >+</text>
<rect x="342" y="24" width="270" height="236" rx="12" fill="#eef8f4" stroke="#009e73" stroke-width="2"/>
<circle cx="366" cy="56" r="6" fill="#000000" stroke="#ffffff" stroke-width="1.2"/>
