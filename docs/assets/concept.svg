<circle cx="384" cy="56" r="6" fill="#e69f00" stroke="#ffffff" stroke-width="1.2"/>
<text x="398" y="58" font-size="19" font-weight="700" fill="#1c2026" text-anchor="start" >Style</text>
<text x="398" y="78" font-size="12.5" font-weight="normal" fill="#5d6673" text-anchor="start" >a preset or style file · how it looks</text>
<text x="360" y="116" font-size="13.5" fill="#1c2026"><tspan font-weight="600">size</tspan> <tspan fill="#5d6673">85 × 64 mm (one column)</tspan></text>
<text x="360" y="137" font-size="13.5" fill="#1c2026"><tspan font-weight="600">font</tspan> <tspan fill="#5d6673">Arial 10 pt</tspan></text>
<text x="360" y="158" font-size="13.5" fill="#1c2026"><tspan font-weight="600">lines, ticks</tspan> <tspan fill="#5d6673">widths, lengths</tspan></text>
<text x="360" y="179" font-size="13.5" fill="#1c2026"><tspan font-weight="600">colours</tspan> <tspan fill="#5d6673">curves, colour maps</tspan></text>
<text x="360" y="200" font-size="13.5" fill="#1c2026"><tspan font-weight="600">fixed scales</tspan> <tspan fill="#5d6673">S21 always −20 … 0 dB</tspan></text>
<text x="360" y="246" font-size="12" font-weight="normal" fill="#5d6673" text-anchor="start" font-style="italic">shared by all your files</text>
<path d="M624 142.0 h30" stroke="#5d6673" stroke-width="3" fill="none"/><path d="M654 133.0 l12 9 l-12 9 z" fill="#5d6673"/>
