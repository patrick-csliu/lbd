[project]
name = "lbd"
version = "0.1.0"
description = "Read and write LBD (Lab Data, .lbd) files"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21",
    "h5py>=3.6",
]

[project.optional-dependencies]
# lbd.plot: figures with LBD styles (the same engine as LBD Viewer)
plot = [
    "matplotlib>=3.8",
    "pydantic>=2.5",
    "platformdirs>=4.0",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lbd"]
