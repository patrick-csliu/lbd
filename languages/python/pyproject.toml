[project]
name = "lbd"
version = "1.2.0.dev0"
description = "Read and write LBD (Lab Data, .lbd) files"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=1.21",
    "h5py>=3.6",
]

[project.optional-dependencies]
# lbd.plot: figures with LBD styles (the same engine as LBD Viewer)
plot = [
    "matplotlib>=3.8",
    "pydantic>=2.5",
    "platformdirs>=4.0",
]

[project.urls]
Source = "https://github.com/patrick-csliu/lbd"
Issues = "https://github.com/patrick-csliu/lbd/issues"
Changelog = "https://github.com/patrick-csliu/lbd/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.27"]   # 1.27: SPDX `license`
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lbd"]
