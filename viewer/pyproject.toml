[project]
name = "lbd-viewer"
version = "1.3.0.dev0"
description = "LBD Viewer: list and plot LBD (.lbd) files in the browser"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "lbd[plot]==1.3.0.dev0",   # styles and the plotting engine; exact: the viewer ships with its own lbd
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pillow>=10.0",       # image metadata (also a matplotlib dependency)
    "send2trash>=1.8",    # "Move to Recycle Bin" in the folder panel
]

[project.scripts]
lbd-view = "lbd_viewer.cli:main"

[tool.uv.sources]
lbd = { workspace = true }

[project.urls]
Source = "https://github.com/patrick-csliu/lbd"
Issues = "https://github.com/patrick-csliu/lbd/issues"
Changelog = "https://github.com/patrick-csliu/lbd/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling>=1.27"]   # 1.27: SPDX `license`
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lbd_viewer"]
# Git-ignored but part of the package: the built web UI, and in the release wheel the Help
# (docs) and the language modules (sdk), staged by scripts/build_wheels.py.
artifacts = ["src/lbd_viewer/static", "src/lbd_viewer/docs", "src/lbd_viewer/sdk"]
